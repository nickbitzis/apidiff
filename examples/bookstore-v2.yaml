openapi: 3.0.3
info:
  title: Bookstore API
  version: 2.0.0
security:
  - apiKey: []
paths:
  /books:
    get:
      operationId: listBooks
      parameters:
        - name: limit
          in: query
          schema: { type: integer, maximum: 50 }
        - name: genre
          in: query
          schema: { type: string }
        - name: in_stock
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Book" } }
                  next_cursor: { type: string }
                  total: { type: integer }
    post:
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewBook" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "409":
          description: A book with this ISBN already exists
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getBook
      responses:
        "200":
          description: One book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404":
          description: Not found
    delete:
      operationId: removeBook
      security:
        - oauth: [books.write]
      responses:
        "204":
          description: Deleted
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes: { books.read: Read books, books.write: Change books }
  schemas:
    NewBook:
      type: object
      required: [title, author, isbn]
      properties:
        title: { type: string, maxLength: 200 }
        author: { type: string }
        format: { type: string, enum: [hardcover, paperback, ebook, audiobook] }
        price: { type: number }
        isbn: { type: string }
    Book:
      type: object
      required: [id, title, author]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        format: { type: string, enum: [hardcover, paperback, ebook, audiobook] }
        price: { type: number, nullable: true }
        isbn: { type: string }
